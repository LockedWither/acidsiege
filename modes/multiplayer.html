<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ACID SIEGE — Multiplayer (PvP)</title>
<meta name="theme-color" content="#06141b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2306141b'/%3E%3Cpath d='M16 5c4 5 7 8 7 12a7 7 0 1 1-14 0c0-4 3-7 7-12z' fill='%238ef02a'/%3E%3C/svg%3E">
<style>
  :root{ --bg0:#06141b;--bg1:#0a2531;--bg2:#0e3242;--panel:rgba(10,30,40,.72);--edge:rgba(126,252,74,.18);
    --ink:#dff3ee;--muted:#7fa6a0;--toxic:#8ef02a;--toxic2:#5fae1f;--amber:#ffb627;--danger:#ff5347;}
  *{box-sizing:border-box} html,body{margin:0;height:100%;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
  body{font-family:Outfit,system-ui,sans-serif;color:var(--ink);overflow:hidden;
    background:radial-gradient(1200px 700px at 78% -10%,#133a3f 0,transparent 55%),linear-gradient(160deg,var(--bg0),var(--bg1) 60%,var(--bg2));}
  #wrap{height:100%;display:grid;grid-template-columns:280px 1fr;gap:12px;padding:12px}
  #side{display:flex;flex-direction:column;gap:10px;min-height:0;overflow:auto}
  .card{background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:11px;box-shadow:0 18px 50px rgba(0,0,0,.5)}
  .card h2{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
  h1{font-family:Bungee,Impact,sans-serif;font-size:22px;margin:0;color:var(--toxic);letter-spacing:1px}
  .sub{font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
  .pwrap{display:flex;gap:8px} .pwrap .card{flex:1}
  .coins{font-family:Bungee,Impact;font-size:22px;color:var(--amber)}
  .meter{height:12px;border-radius:7px;background:rgba(0,0,0,.35);overflow:hidden;border:1px solid rgba(255,255,255,.08);margin-top:4px}
  .meter>i{display:block;height:100%;background:var(--toxic);width:100%;transform-origin:left;transition:transform .15s linear}
  .you i{background:#3ec46b} .opp i{background:#e24a4a}
  .row{display:flex;justify-content:space-between;font-size:12px;margin-top:5px}
  .tools{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:230px;overflow:auto}
  .tool{display:flex;align-items:center;gap:7px;padding:6px 7px;border-radius:9px;cursor:pointer;background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.07);user-select:none}
  .tool.sel{border-color:var(--toxic);box-shadow:0 0 0 1px var(--toxic)}
  .tool.locked{opacity:.6} .tool .dot{width:11px;height:11px;border-radius:3px;flex:none}
  .tool .nm{font-size:11px;font-weight:600} .tool .cost{font-size:9px;color:var(--amber)}
  .btn{width:100%;border:none;border-radius:11px;padding:10px;cursor:pointer;font-weight:800;font-size:12px;color:#06141b;
    background:linear-gradient(180deg,var(--toxic),var(--toxic2));margin-top:8px}
  .btn:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.4)}
  .btn.alt{background:rgba(255,255,255,.05);color:var(--ink);border:1px solid var(--edge)}
  #stage{position:relative;display:flex;align-items:center;justify-content:center;min-width:0}
  #frame{position:relative;border-radius:16px;overflow:hidden;box-shadow:0 0 0 1px rgba(126,252,74,.25);background:#04141a;line-height:0}
  canvas{display:block;image-rendering:pixelated;touch-action:none;cursor:crosshair}
  .tag{position:absolute;top:8px;font-family:Bungee,Impact;font-size:12px;letter-spacing:1px;padding:4px 9px;border-radius:8px;
    background:rgba(4,20,26,.6);border:1px solid rgba(255,255,255,.08);z-index:3}
  .tag.l{left:10px} .tag.r{right:10px;color:var(--danger)}
  .chatlog{height:92px;overflow:auto;background:rgba(0,0,0,.3);border-radius:9px;padding:7px;font-size:12px;line-height:1.5}
  .chatin{display:flex;gap:6px;margin-top:7px} .chatin input{flex:1;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.1);
    border-radius:8px;color:var(--ink);padding:7px;font-family:inherit;font-size:12px}
  .chatin button{border:none;border-radius:8px;padding:0 12px;cursor:pointer;font-weight:800;color:#06141b;background:var(--toxic)}
  #lobby{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    text-align:center;background:radial-gradient(900px 600px at 50% -10%,#15414a 0,transparent 60%),linear-gradient(160deg,var(--bg0),var(--bg2))}
  #lobby h1{font-size:clamp(38px,11vw,80px);line-height:.9;text-shadow:0 0 30px rgba(126,252,74,.4),4px 4px 0 #07181f}
  #lobby .mbtn{font-family:Bungee,Impact;font-size:18px;padding:15px 30px;border:none;border-radius:14px;cursor:pointer;color:#06141b;
    background:linear-gradient(180deg,var(--toxic),var(--toxic2));box-shadow:0 8px 24px rgba(126,252,74,.3)}
  #lobby .status{color:var(--muted);font-size:14px;min-height:20px}
  .hidden{display:none!important}
  @media(max-width:820px){ #wrap{grid-template-columns:1fr;gap:8px;padding:8px} #side{flex-direction:row;flex-wrap:wrap} #side .card{flex:1 1 46%} }
</style>
</head>
<body>
<div id="lobby">
  <h1>ACID<br>SIEGE</h1>
  <div class="sub">Multiplayer · Player vs Player</div>
  <button class="mbtn" id="findBtn">FIND MATCH</button>
  <div class="status" id="status"></div>
  <div style="margin-top:10px;color:var(--muted);font-size:12px;letter-spacing:2px">MADE BY LIAM HUTSON</div>
</div>

<div id="wrap" class="hidden">
  <aside id="side">
    <div class="card"><h1>ACID SIEGE</h1><div class="sub">PvP · you are <b id="sideName">P1</b></div>
      <div class="row"><span>Round <b id="roundN">1</b> · Wave <b id="waveN">1</b></span><span>Score <b id="score">0–0</b></span></div></div>
    <div class="pwrap">
      <div class="card you"><h2>You</h2><div class="coins" id="cYou">0</div><div class="meter you"><i id="barYou"></i></div></div>
      <div class="card opp"><h2>Opponent</h2><div class="coins" id="cOpp">0</div><div class="meter opp"><i id="barOpp"></i></div></div>
    </div>
    <div class="card"><h2>Upgrades</h2>
      <div class="row"><span>Lv <b id="lvN">1</b> · 🛡<b id="protN">0</b></span><span>Brush <b id="brushN">2</b></span></div>
      <button class="btn" id="upBtn">LEVEL UP — <span id="upCost">400</span></button>
      <button class="btn alt" id="brBtn">BRUSH — <span id="brCost">200</span></button>
    </div>
    <div class="card"><h2>Chemicals</h2><div class="tools" id="tools"></div></div>
    <div class="card"><h2>Chat</h2><div class="chatlog" id="chatlog"></div>
      <div class="chatin"><input id="chatbox" maxlength="140" placeholder="Say something…"><button id="chatsend">Send</button></div></div>
  </aside>
  <main id="stage"><div id="frame">
    <div class="tag l" id="tagYou">YOU</div><div class="tag r" id="tagOpp">OPP</div>
    <canvas id="cv"></canvas>
  </div></main>
</div>

<script>
const COLS_DEF=180, ROWS_DEF=112;
let COLS=COLS_DEF, ROWS=ROWS_DEF, mySide=0, palette=[], unlocked=new Set(), tool=3 /*ACID*/;
let ws=null, started=false, mirror=false;

// ---- element colour lookup (id -> [r,g,b]); cities tinted by owner ----
const LUT=new Array(256).fill(null).map(()=>[8,22,28]);
function setC(i,r,g,b){ LUT[i]=[r,g,b]; }
setC(1,217,193,122); setC(2,54,123,212); setC(3,120,240,42); setC(4,255,140,40); setC(5,122,74,35);
setC(6,212,52,52);  setC(7,62,72,82);   setC(8,224,74,74);  setC(9,70,72,80);   setC(10,200,214,220);
setC(11,55,40,30);  setC(12,110,108,104);setC(13,180,220,235);setC(14,255,90,20); setC(15,200,90,255);
setC(16,62,196,107);setC(17,255,150,40);setC(18,255,150,40);setC(19,108,128,46);setC(20,70,78,92);
setC(21,120,0,160);setC(22,150,40,150);
function hexToRgb(h){const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255];}

// ---- canvas / render ----
const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
const sim=document.createElement("canvas"), sctx=sim.getContext("2d");
let img=null, buf=null, grid=null;
function initBuffers(){ sim.width=COLS; sim.height=ROWS; img=sctx.createImageData(COLS,ROWS); buf=img.data; grid=new Uint8Array(COLS*ROWS); fit(); }
function fit(){ const s=document.getElementById("stage"); const ar=COLS/ROWS; let w=s.clientWidth,h=w/ar;
  if(h>s.clientHeight){ h=s.clientHeight; w=h*ar; } const sc=Math.max(1,Math.floor(w/COLS));
  cv.width=COLS*sc; cv.height=ROWS*sc; cv.style.width=w+"px"; cv.style.height=h+"px"; }
addEventListener("resize",()=>{ if(started) fit(); });
function unpackRLE(runs){ let p=0; for(let k=0;k<runs.length;k+=2){ const v=runs[k],c=runs[k+1]; for(let n=0;n<c;n++) grid[p++]=v; } }
function render(){ let p=0; for(let i=0;i<grid.length;i++){ const c=LUT[grid[i]]||LUT[0]; buf[p++]=c[0];buf[p++]=c[1];buf[p++]=c[2];buf[p++]=255; }
  sctx.putImageData(img,0,0); ctx.imageSmoothingEnabled=false; ctx.clearRect(0,0,cv.width,cv.height);
  if(mirror){ ctx.save(); ctx.translate(cv.width,0); ctx.scale(-1,1); ctx.drawImage(sim,0,0,cv.width,cv.height); ctx.restore(); }
  else ctx.drawImage(sim,0,0,cv.width,cv.height); }

// ---- networking ----
function connect(){
  const proto = location.protocol==="https:"?"wss":"ws";
  ws=new WebSocket(proto+"://"+location.host);
  ws.onopen=()=>{ ws.send(JSON.stringify({t:"queue"})); status("Searching for an opponent…"); };
  ws.onclose=()=>{ status("Disconnected. Refresh to retry."); };
  ws.onerror=()=>{ status("Connection error. Is the server running?"); };
  ws.onmessage=ev=>{ const m=JSON.parse(ev.data); handle(m); };
}
function handle(m){
  if(m.t==="waiting"){ status("Waiting for another player… (open this URL in a second tab/device)"); }
  else if(m.t==="start"){ COLS=m.cols; ROWS=m.rows; mySide=m.side; palette=m.palette; initBuffers(); buildTools(); startGame(); }
  else if(m.t==="state"){ unpackRLE(m.grid); render(); hud(m.meta); }
  else if(m.t==="chat"){ addChat(m.from, m.text); }
  else if(m.t==="opponentLeft"){ status("Opponent left."); addChat("system","Opponent disconnected — you win by default!"); }
}
function send(o){ if(ws&&ws.readyState===1) ws.send(JSON.stringify(o)); }
function status(s){ document.getElementById("status").textContent=s; }

// ---- lobby / start ----
document.getElementById("findBtn").onclick=()=>{ document.getElementById("findBtn").disabled=true; connect(); };
function startGame(){ started=true; document.getElementById("lobby").classList.add("hidden"); document.getElementById("wrap").classList.remove("hidden");
  document.getElementById("sideName").textContent="P"+(mySide+1);
  // perspective-relative view: YOUR city is always shown on the LEFT in green, the enemy on the RIGHT in red.
  // For player 2 we mirror the arena horizontally (and remap input) so it isn't "your red city on the right".
  mirror = (mySide===1);
  const mineType = mySide===0?16:8, foeType = mySide===0?8:16;   // 16=PCITY (left), 8=CITY (right)
  LUT[mineType]=[62,196,107];   // your city → green
  LUT[foeType]=[224,74,74];     // enemy city → red
  document.getElementById("tagYou").textContent="YOU"; document.getElementById("tagOpp").textContent="OPP";
  fit();
}

// ---- HUD ----
function hud(meta){
  const me=meta.players[mySide], opp=meta.players[mySide^1];
  document.getElementById("roundN").textContent=meta.round;
  document.getElementById("waveN").textContent=meta.wave;
  document.getElementById("score").textContent=meta.scores[mySide]+"–"+meta.scores[mySide^1];
  document.getElementById("cYou").textContent=me.coins.toLocaleString();
  document.getElementById("cOpp").textContent=opp.coins.toLocaleString();
  document.getElementById("barYou").style.transform="scaleX("+Math.max(0,me.cells/me.max)+")";
  document.getElementById("barOpp").style.transform="scaleX("+Math.max(0,opp.cells/opp.max)+")";
  document.getElementById("lvN").textContent=me.level;
  document.getElementById("protN").textContent=Math.round(0.02*(me.level-1)**3);
  document.getElementById("brushN").textContent=me.brush;
  document.getElementById("upCost").textContent=me.upCost.toLocaleString();
  document.getElementById("brCost").textContent=me.brushCost?me.brushCost.toLocaleString():"MAX";
  document.getElementById("upBtn").disabled=me.coins<me.upCost;
  document.getElementById("brBtn").disabled=me.brushCost==null||me.coins<me.brushCost;
  unlocked=new Set(me.unlocked); refreshToolLocks(me);
}
document.getElementById("upBtn").onclick=()=>send({t:"upgrade",what:"level"});
document.getElementById("brBtn").onclick=()=>send({t:"upgrade",what:"brush"});

// ---- tools ----
const toolsEl=document.getElementById("tools");
function buildTools(){ toolsEl.innerHTML=""; palette.forEach(p=>{
    const el=document.createElement("div"); el.dataset.t=p.t; el.className="tool";
    el.innerHTML=`<span class="dot" style="background:${p.col}"></span><span><span class="nm">${p.nm}</span><div class="cost"></div></span>`;
    el.onclick=()=>{ const locked=p.cost>0&&!unlocked.has(p.t);
      if(locked) send({t:"unlock",tool:p.t}); tool=p.t; markSel(); };
    toolsEl.appendChild(el);
  }); markSel(); }
function markSel(){ [...toolsEl.children].forEach(el=>el.classList.toggle("sel",+el.dataset.t===tool)); }
function refreshToolLocks(me){ [...toolsEl.children].forEach(el=>{ const t=+el.dataset.t; const p=palette.find(q=>q.t===t);
    const locked=p.cost>0&&!unlocked.has(t); el.classList.toggle("locked",locked);
    el.querySelector(".cost").textContent=locked?p.cost.toLocaleString()+"c":""; }); }

// ---- input (send placements, server uses your brush) ----
let down=false, gx=0, gy=0, sendTimer=0;
function toGrid(e){ const r=cv.getBoundingClientRect(); const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left, cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
  gx=Math.floor(cx/r.width*COLS); gy=Math.floor(cy/r.height*ROWS);
  if(mirror) gx=COLS-1-gx;   // input is in mirrored display space → convert back to true server coords
}
function placeNow(){ send({t:"place",tool,x:gx,y:gy}); }
cv.addEventListener("pointerdown",e=>{ if(!started)return; down=true; toGrid(e); placeNow(); cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove",e=>{ if(!down)return; toGrid(e); });
addEventListener("pointerup",()=>down=false);
setInterval(()=>{ if(down&&started){ placeNow(); } }, 55);   // hold-to-paint, throttled

// ---- chat ----
const chatlog=document.getElementById("chatlog"), chatbox=document.getElementById("chatbox");
function esc(s){ return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function addChat(from,text){ const d=document.createElement("div"); const me=from==="P"+(mySide+1);
  d.innerHTML = from==="system" ? `<i style="color:#7fa6a0">${esc(text)}</i>` : `<b style="color:${me?'#8ef02a':'#e24a4a'}">${esc(from)}</b> ${esc(text)}`;
  chatlog.appendChild(d); chatlog.scrollTop=chatlog.scrollHeight; }
function sendChat(){ const v=chatbox.value.trim(); if(!v)return; send({t:"chat",text:v}); chatbox.value=""; }
document.getElementById("chatsend").onclick=sendChat;
chatbox.addEventListener("keydown",e=>{ if(e.key==="Enter") sendChat(); });
</script>
</body>
</html>
